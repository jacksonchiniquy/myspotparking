<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Login — My Spot Parking</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f7ff;--surface:#ffffff;--surface2:#f0f4ff;--border:rgba(15,23,42,0.09);
  --blue:#1a6fff;--blue2:#4d8fff;--bluelight:#e8f1ff;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --green:#00c87a;--amber:#f59e0b;--red:#ef4444;
  --shadow:0 1px 4px rgba(15,23,42,0.06),0 4px 16px rgba(15,23,42,0.04);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;}

/* ── NAV ── */
.topnav{position:fixed;top:0;left:0;right:0;z-index:600;height:60px;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:0;}
.tn-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);}
.tn-logo-mark{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;box-shadow:0 2px 10px rgba(26,111,255,.4);}
.tn-logo-text{font-size:17px;font-weight:700;letter-spacing:-.03em;}
.tn-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tn-badge{background:var(--bluelight);border:1px solid rgba(26,111,255,.2);color:var(--blue);padding:3px 10px;border-radius:20px;font-size:11px;font-family:'JetBrains Mono',monospace;}
.btn-signout{background:none;border:1px solid var(--border);color:var(--text3);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-family:'Bricolage Grotesque',sans-serif;transition:all .2s;display:none;}
.btn-signout:hover{border-color:var(--red);color:var(--red);}

/* ── GATE ── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 20px 40px;}
.gate-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(15,23,42,0.10);}
.gate-badge{display:inline-flex;align-items:center;gap:7px;background:var(--bluelight);border:1px solid rgba(26,111,255,.2);border-radius:20px;padding:4px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;}
.gate-title{font-size:22px;font-weight:800;letter-spacing:-.04em;margin-bottom:4px;}
.gate-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.form-input,.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:9px;font-family:'Bricolage Grotesque',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;}
.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,111,255,.1);background:#fff;}
.form-input::placeholder{color:var(--text3);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;font-family:'Bricolage Grotesque',sans-serif;font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;border:none;transition:all .2s;text-decoration:none;white-space:nowrap;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 3px 12px rgba(26,111,255,.35);}
.btn-primary:hover{background:#0d5de0;transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--blue);border-color:var(--blue);}
.btn-danger{background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.btn-danger:hover{background:rgba(239,68,68,.15);}
.btn-full{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
.err-msg{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:14px;display:none;}
.err-msg.show{display:block;}
.back-link{text-align:center;margin-top:14px;font-size:12px;color:var(--text3);}
.back-link a{color:var(--blue);text-decoration:none;cursor:pointer;}

/* ── APP ── */
#app{display:none;padding-top:60px;min-height:100vh;}
.app-wrap{max-width:680px;margin:0 auto;padding:32px 20px 80px;}

/* ── UNIT HEADER ── */
.unit-header{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:var(--shadow);}
.unit-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
.unit-number{font-size:28px;font-weight:800;letter-spacing:-.04em;}
.unit-prop{font-size:13px;color:var(--text2);margin-top:2px;}
.unit-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.upill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--bluelight);border:1px solid rgba(26,111,255,.15);color:var(--blue);}

/* ── SLOT CARDS ── */
.slots-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.slots-title{font-size:15px;font-weight:700;}
.slot-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.slot-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.slot-card.type-garage::before{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.slot-card.type-open::before{background:linear-gradient(90deg,var(--blue),var(--blue2));}
.slot-card.type-carport::before{background:linear-gradient(90deg,#0891b2,#67e8f9);}
.slot-card.type-reserved::before{background:linear-gradient(90deg,var(--amber),#fbbf24);}
.slot-card.type-ev::before{background:linear-gradient(90deg,var(--green),#34d399);}
.slot-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
.slot-icon-wrap{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.slot-icon-wrap.type-garage{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2);}
.slot-icon-wrap.type-open{background:var(--bluelight);border:1px solid rgba(26,111,255,.2);}
.slot-icon-wrap.type-carport{background:rgba(8,145,178,.1);border:1px solid rgba(8,145,178,.2);}
.slot-icon-wrap.type-reserved{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);}
.slot-icon-wrap.type-ev{background:rgba(0,200,122,.1);border:1px solid rgba(0,200,122,.2);}
.slot-meta{flex:1;}
.slot-label{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px;}
.slot-type-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text3);}
.slot-managed-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-family:'JetBrains Mono',monospace;margin-left:8px;}
.slot-managed-tag.manager{background:rgba(245,158,11,.1);color:#b45309;border:1px solid rgba(245,158,11,.2);}
.slot-managed-tag.tenant{background:rgba(0,200,122,.1);color:#007a4a;border:1px solid rgba(0,200,122,.2);}

/* ── CURRENT VEHICLE ── */
.vehicle-current{background:rgba(0,200,122,.06);border:1px solid rgba(0,200,122,.2);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.vc-label{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
.vc-plate{font-size:22px;font-weight:800;letter-spacing:.1em;font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
.vc-desc{font-size:13px;color:var(--text2);}
.vc-expire{font-size:11px;color:var(--text3);margin-top:4px;}

.vehicle-empty{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;text-align:center;}
.ve-icon{font-size:28px;margin-bottom:6px;}
.ve-text{font-size:13px;color:var(--text3);}

/* ── SWAP FORM ── */
.swap-form{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;display:none;}
.swap-form.open{display:block;}
.swap-form .form-group{margin-bottom:12px;}
.swap-form .form-input{font-size:13px;padding:9px 12px;}
.disclaimer-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
.disclaimer-text{font-size:12px;color:#92400e;line-height:1.5;margin-bottom:8px;}
.disclaimer-check{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;}
.disclaimer-check input{margin-top:2px;accent-color:var(--amber);flex-shrink:0;}
.swap-actions{display:flex;gap:8px;}
.locked-notice{display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:8px;padding:10px 12px;font-size:12px;color:#92400e;}
.locked-notice svg{flex-shrink:0;}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;z-index:9999;transform:translateY(12px);opacity:0;transition:all .3s;max-width:320px;box-shadow:0 8px 32px rgba(15,23,42,0.1);}
#toast.show{opacity:1;transform:translateY(0);}

/* ── LOADING ── */
.loading-screen{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){.app-wrap{padding:20px 14px 60px;}.unit-header{padding:18px;}.slot-card{padding:16px;}.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- NAV -->
<nav class="topnav">
  <a class="tn-logo" href="index.html">
    <div class="tn-logo-mark">M</div>
    <span class="tn-logo-text">My Spot Parking</span>
  </a>
  <div class="tn-right">
    <span class="tn-badge" id="unit-badge" style="display:none;">Unit —</span>
    <button class="btn-signout" id="signout-btn" onclick="signOut()">Sign Out</button>
  </div>
</nav>

<!-- GATE: unit login -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-badge">🏠 Unit Login</div>
    <div class="gate-title">Resident Parking</div>
    <div class="gate-sub">Sign in with your unit number and password to manage your parking spot.</div>
    <div class="err-msg" id="gate-err"></div>
    <div class="form-group">
      <label class="form-label">Property</label>
      <select class="form-select" id="gate-property">
        <option value="">Loading properties…</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Unit Number</label>
      <input class="form-input" id="gate-unit" type="text" placeholder="e.g. A-102" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="gate-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary btn-full" style="font-size:15px;padding:13px;" id="gate-btn" onclick="doLogin()">Sign In →</button>
    <div class="back-link"><a href="portals.html">← Back to portals</a></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-wrap">
    <!-- Loading -->
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <div>Loading your parking info…</div>
    </div>

    <!-- Unit header -->
    <div id="unit-header" style="display:none;">
      <div class="unit-header">
        <div class="unit-header-top">
          <div>
            <div class="unit-number" id="uh-unit">Unit —</div>
            <div class="unit-prop" id="uh-prop">—</div>
          </div>
        </div>
        <div class="unit-pills" id="uh-pills"></div>
      </div>

      <!-- Slots -->
      <div class="slots-head">
        <div class="slots-title">Your Parking Slots</div>
      </div>
      <div id="slots-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL='https://ajadbfojccztiauxyxos.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqYWRiZm9qY2N6dGlhdXh5eG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTU1NDcsImV4cCI6MjA5MjM3MTU0N30.dHMc-kGb0YFHnTfxnwGYfikmKZBLPzS5lfe6SyRsguU';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

let session=null; // {propertyId, propertyName, unitNumber}
let unitSlots=[];
let unitPermits={};

// ── BOOT ──
async function boot(){
  // Check sessionStorage for existing session
  const saved=sessionStorage.getItem('unit_session');
  if(saved){
    try{
      session=JSON.parse(saved);
      showApp();
      return;
    }catch(e){sessionStorage.removeItem('unit_session');}
  }
  // Load properties for dropdown
  await loadPropertyDropdown();
  // Check URL params (?property=ID&unit=A-102)
  const params=new URLSearchParams(window.location.search);
  const pId=params.get('property')||params.get('lot');
  const uNum=params.get('unit');
  if(pId){document.getElementById('gate-property').value=pId;}
  if(uNum){document.getElementById('gate-unit').value=uNum;}
}

async function loadPropertyDropdown(){
  const {data}=await sb.from('properties').select('id,name,address').order('name');
  const sel=document.getElementById('gate-property');
  if(!data||!data.length){sel.innerHTML='<option value="">No properties found</option>';return;}
  sel.innerHTML='<option value="">— Select your property —</option>'+
    data.map(p=>`<option value="${p.id}">${p.name}${p.address?' — '+p.address:''}</option>`).join('');
}

async function doLogin(){
  const propertyId=document.getElementById('gate-property').value;
  const unitNumber=document.getElementById('gate-unit').value.trim();
  const password=document.getElementById('gate-pass').value;
  const err=document.getElementById('gate-err');
  const btn=document.getElementById('gate-btn');
  err.classList.remove('show');

  if(!propertyId){err.textContent='Please select your property.';err.classList.add('show');return;}
  if(!unitNumber){err.textContent='Please enter your unit number.';err.classList.add('show');return;}
  if(!password){err.textContent='Please enter your password.';err.classList.add('show');return;}

  btn.disabled=true;btn.textContent='Signing in…';

  // Look up any slot for this unit + property — check password on first match
  const {data:slots,error}=await sb
    .from('property_units')
    .select('*')
    .eq('property_id',propertyId)
    .eq('unit_number',unitNumber)
    .limit(1);

  if(error||!slots||!slots.length){
    err.textContent='Unit not found for this property. Contact your property manager.';
    err.classList.add('show');btn.disabled=false;btn.textContent='Sign In →';return;
  }

  const slot=slots[0];
  if(!slot.unit_password){
    err.textContent='No password set for this unit. Contact your property manager.';
    err.classList.add('show');btn.disabled=false;btn.textContent='Sign In →';return;
  }

  // Simple plaintext comparison (Option A — manager shares password)
  // For production, consider bcrypt via a Netlify function
  if(slot.unit_password!==password){
    err.textContent='Incorrect password. Check with your property manager.';
    err.classList.add('show');btn.disabled=false;btn.textContent='Sign In →';return;
  }

  // Get property name
  const {data:prop}=await sb.from('properties').select('name').eq('id',propertyId).single();

  session={propertyId,unitNumber,propertyName:prop?.name||'Property'};
  sessionStorage.setItem('unit_session',JSON.stringify(session));
  btn.disabled=false;btn.textContent='Sign In →';
  showApp();
}

function signOut(){
  session=null;
  sessionStorage.removeItem('unit_session');
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('gate-pass').value='';
  document.getElementById('unit-badge').style.display='none';
  document.getElementById('signout-btn').style.display='none';
}

async function showApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('unit-badge').textContent='Unit '+session.unitNumber;
  document.getElementById('unit-badge').style.display='';
  document.getElementById('signout-btn').style.display='';
  await loadUnitData();
}

// ── DATA ──
async function loadUnitData(){
  document.getElementById('loading-screen').style.display='flex';
  document.getElementById('unit-header').style.display='none';

  // Load all slots for this unit
  const {data:slots}=await sb
    .from('property_units')
    .select('*')
    .eq('property_id',session.propertyId)
    .eq('unit_number',session.unitNumber)
    .order('slot_label');

  unitSlots=slots||[];

  // Load current unit_permits for these slots
  const slotIds=unitSlots.map(s=>s.id);
  let currentPermits={};
  if(slotIds.length){
    const {data:ups}=await sb
      .from('unit_permits')
      .select('*')
      .in('unit_slot_id',slotIds)
      .is('void_at',null); // only non-voided
    (ups||[]).forEach(up=>{currentPermits[up.unit_slot_id]=up;});
  }
  unitPermits=currentPermits;

  // Render
  renderHeader();
  renderSlots();

  document.getElementById('loading-screen').style.display='none';
  document.getElementById('unit-header').style.display='block';
}

function renderHeader(){
  document.getElementById('uh-unit').textContent='Unit '+session.unitNumber;
  document.getElementById('uh-prop').textContent=session.propertyName;
  const garage=unitSlots.filter(s=>typeGroup(s.slot_type)==='garage').length;
  const open=unitSlots.filter(s=>typeGroup(s.slot_type)!=='garage').length;
  const pills=[];
  if(garage) pills.push(`<span class="upill">🏗 ${garage} Garage${garage>1?'s':''}</span>`);
  if(open)   pills.push(`<span class="upill">🅿️ ${open} Open Spot${open>1?'s':''}</span>`);
  pills.push(`<span class="upill">🚗 ${unitSlots.length} Total Slot${unitSlots.length!==1?'s':''}</span>`);
  document.getElementById('uh-pills').innerHTML=pills.join('');
}

function typeGroup(slotType){
  if(slotType==='zone-garage') return 'garage';
  if(slotType==='zone-carport') return 'carport';
  return 'open';
}

function slotIcon(slotType){
  const icons={'zone-garage':'🏗','zone-carport':'🏠','stall-ev':'⚡','stall-reserved':'⭐','stall-handicap':'♿','stall-guest':'🎟','stall-moto':'🏍'};
  return icons[slotType]||'🅿️';
}

function slotTypeLabel(slotType){
  const labels={'zone-garage':'Garage','zone-carport':'Carport','stall-standard':'Open Stall','stall-reserved':'Reserved Stall','stall-ev':'EV Charging','stall-handicap':'Handicap','stall-guest':'Guest','stall-moto':'Motorcycle'};
  return labels[slotType]||slotType;
}

function slotCssClass(slotType){
  if(slotType==='zone-garage') return 'type-garage';
  if(slotType==='zone-carport') return 'type-carport';
  if(slotType==='stall-ev') return 'type-ev';
  if(slotType==='stall-reserved') return 'type-reserved';
  return 'type-open';
}

function renderSlots(){
  const list=document.getElementById('slots-list');
  if(!unitSlots.length){
    list.innerHTML='<div style="text-align:center;padding:48px;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:14px;">No parking slots configured for this unit.<br>Contact your property manager.</div>';
    return;
  }

  list.innerHTML=unitSlots.map(slot=>{
    const up=unitPermits[slot.id];
    const isTenant=slot.managed_by==='tenant';
    const cssClass=slotCssClass(slot.slot_type);
    const icon=slotIcon(slot.slot_type);

    const vehicleHtml=up
      ? `<div class="vehicle-current">
          <div class="vc-label">✓ Current Vehicle</div>
          <div class="vc-plate">${up.plate||'—'}</div>
          ${up.vehicle_desc?`<div class="vc-desc">${up.vehicle_desc}</div>`:''}
          <div class="vc-expire">Assigned ${up.assigned_by==='manager'?'by manager':'by resident'} · ${fmt(up.created_at)}</div>
        </div>`
      : `<div class="vehicle-empty">
          <div class="ve-icon">🅿️</div>
          <div class="ve-text">No vehicle currently assigned to this spot.</div>
        </div>`;

    const swapHtml=isTenant
      ? `<div class="swap-form" id="swap-${slot.id}">
          <div class="disclaimer-box">
            <div class="disclaimer-text">⚠️ Swapping your vehicle will <strong>immediately void</strong> the current permit for this slot. The new vehicle will be assigned right away.</div>
            <label class="disclaimer-check">
              <input type="checkbox" id="disc-${slot.id}" onchange="checkSwapReady('${slot.id}')">
              I understand my current permit will be voided immediately.
            </label>
          </div>
          <div class="form-group">
            <label class="form-label">New License Plate *</label>
            <input class="form-input" id="swap-plate-${slot.id}" type="text" placeholder="e.g. TXK-4821" maxlength="10"
              oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9\\-]/g,'');checkSwapReady('${slot.id}')">
          </div>
          <div class="form-group">
            <label class="form-label">Vehicle Description <span style="color:var(--text3);font-weight:400;">(optional)</span></label>
            <input class="form-input" id="swap-desc-${slot.id}" type="text" placeholder="e.g. Silver Honda Civic">
          </div>
          <div class="swap-actions">
            <button class="btn btn-primary" id="swap-btn-${slot.id}" onclick="doSwap('${slot.id}')" disabled>Assign Vehicle →</button>
            <button class="btn btn-ghost" onclick="closeSwap('${slot.id}')">Cancel</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px;" id="swap-trigger-${slot.id}">
          <button class="btn btn-ghost btn-sm" onclick="openSwap('${slot.id}')">
            ${up?'🔄 Swap Vehicle':'➕ Assign Vehicle'}
          </button>
        </div>`
      : `<div class="locked-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          This slot is manager-assigned. Contact your property manager to update the vehicle.
        </div>`;

    return `<div class="slot-card ${cssClass}" id="card-${slot.id}">
      <div class="slot-card-top">
        <div class="slot-icon-wrap ${cssClass}">${icon}</div>
        <div class="slot-meta">
          <div class="slot-label">${slot.slot_label}</div>
          <div class="slot-type-tag">${slotTypeLabel(slot.slot_type)}
            <span class="slot-managed-tag ${slot.managed_by}">${slot.managed_by==='manager'?'🔒 Manager-Assigned':'✏️ Self-Service'}</span>
          </div>
        </div>
      </div>
      ${vehicleHtml}
      ${swapHtml}
    </div>`;
  }).join('');
}

// ── SWAP ──
function openSwap(slotId){
  document.getElementById('swap-'+slotId).classList.add('open');
  document.getElementById('swap-trigger-'+slotId).style.display='none';
  document.getElementById('swap-plate-'+slotId).focus();
}

function closeSwap(slotId){
  document.getElementById('swap-'+slotId).classList.remove('open');
  document.getElementById('swap-trigger-'+slotId).style.display='flex';
  document.getElementById('swap-plate-'+slotId).value='';
  document.getElementById('swap-desc-'+slotId).value='';
  document.getElementById('disc-'+slotId).checked=false;
  document.getElementById('swap-btn-'+slotId).disabled=true;
}

function checkSwapReady(slotId){
  const plate=document.getElementById('swap-plate-'+slotId).value.trim();
  const disc=document.getElementById('disc-'+slotId).checked;
  const btn=document.getElementById('swap-btn-'+slotId);
  // If no current vehicle, disclaimer not needed
  const hasCurrentVehicle=!!unitPermits[slotId];
  btn.disabled=!(plate.length>=2&&(!hasCurrentVehicle||disc));
}

async function doSwap(slotId){
  const plate=document.getElementById('swap-plate-'+slotId).value.trim();
  const desc=document.getElementById('swap-desc-'+slotId).value.trim();
  const btn=document.getElementById('swap-btn-'+slotId);
  btn.disabled=true;btn.textContent='Saving…';

  // 1. Immediately void any existing unit_permit for this slot
  const existing=unitPermits[slotId];
  if(existing){
    await sb.from('unit_permits')
      .update({void_at:new Date().toISOString()})
      .eq('id',existing.id);
    // If the existing slot has a linked permit in the main permits table, revoke it
    if(existing.permit_id){
      await sb.from('permits').update({status:'revoked'}).eq('id',existing.permit_id);
    }
  }

  // 2. Look up or create a permit in the permits table
  // Find the property's active permit for this unit — if manager issued one, link it
  const {data:existingPermit}=await sb.from('permits')
    .select('id')
    .eq('property_id',session.propertyId)
    .eq('unit_number',session.unitNumber)
    .eq('status','active')
    .limit(1)
    .single();

  // Update the existing permit's plate, or create a minimal one
  let permitId=null;
  if(existingPermit){
    await sb.from('permits').update({plate,vehicle:desc||null,status:'active'}).eq('id',existingPermit.id);
    permitId=existingPermit.id;
  } else {
    const today=new Date().toISOString().split('T')[0];
    const future=new Date();future.setFullYear(future.getFullYear()+1);
    const {data:np}=await sb.from('permits').insert({
      property_id:session.propertyId,
      unit_number:session.unitNumber,
      plate,
      vehicle:desc||null,
      permit_type:'Resident — Monthly',
      status:'active',
      plan:'monthly',
      source:'unit-self',
      start_date:today,
      end_date:future.toISOString().split('T')[0]
    }).select().single();
    permitId=np?.id||null;
  }

  // 3. Insert new unit_permit row
  const {error}=await sb.from('unit_permits').insert({
    unit_slot_id:slotId,
    permit_id:permitId,
    plate,
    vehicle_desc:desc||null,
    assigned_by:'tenant'
  });

  if(error){
    toast('❌ Error: '+error.message);
    btn.disabled=false;btn.textContent='Assign Vehicle →';
    return;
  }

  toast('✅ Vehicle assigned to '+plate);
  closeSwap(slotId);
  await loadUnitData(); // reload to refresh the display
}

// ── UTILS ──
function fmt(iso){
  if(!iso)return'—';
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

boot();
</script>
