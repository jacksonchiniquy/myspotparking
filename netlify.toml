[[plugins]]
package = "@netlify/plugin-functions-install-core"
 
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_KEY"
 

# Short address printed on Pay to Park signs
[[redirects]]
from = "/park"
to = "/park.html"
status = 200

# LotHQ Login (residents, tenants, employees)
[[redirects]]
from = "/login"
to = "/login.html"
status = 200

# Privacy Policy and Terms (lothq.com/privacy, lothq.com/terms)
[[redirects]]
from = "/privacy"
to = "/privacy.html"
status = 200

[[redirects]]
from = "/terms"
to = "/terms.html"
status = 200

# Help Center (lothq.com/help)
[[redirects]]
from = "/help"
to = "/help.html"
status = 200

# Guest pass "ends soon" emails
[functions."guest-reminders"]
schedule = "*/15 * * * *"

# Guest uses a guest pass code
[[redirects]]
from = "/guest"
to = "/guest.html"
status = 200
